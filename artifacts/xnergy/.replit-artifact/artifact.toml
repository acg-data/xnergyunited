kind = "web"
previewPath = "/"
title = "Xnergy United Network"
version = "1.0.0"
id = "artifacts/xnergy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18200

[services.development]
run = "pnpm --filter @workspace/xnergy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xnergy", "run", "build" ]
publicDir = "artifacts/xnergy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18200"
BASE_PATH = "/"
